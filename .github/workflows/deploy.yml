name: Build and Deploy
on:
  push:
    branches: ['main']

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/money-waster:latest

      - name: Join Tailscale Network
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: SSH and Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: MONGODB_URI
          script: |
            echo "MONGODB_URI=$MONGODB_URI" > /home/ubuntu/.env

            sudo podman pull ghcr.io/${{ github.repository_owner }}/money-waster:latest
            sudo podman stop money-waster || true
            sudo podman rm money-waster || true

            sudo podman run -d \
              --name money-waster \
              -p 8080:80 \
              --env-file /home/ubuntu/.env \
              --restart always \
              ghcr.io/${{ github.repository_owner }}/money-waster:latest
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
